<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 220px;
      font-family: system-ui, sans-serif;
      padding: 16px;
      text-align: center;
    }
    h3 {
      margin: 0 0 12px;
      font-size: 14px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 52px;
      height: 28px;
    }
    .switch input { display: none; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #ccc;
      transition: 0.2s;
      border-radius: 28px;
    }
    .slider::before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #ff0000;
    }
    input:checked + .slider::before {
      transform: translateX(24px);
    }
    #status {
      margin-top: 10px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>
  <h3>Xóa Playlist Radio (&list=)</h3>
  <label class="switch">
    <input type="checkbox" id="toggle" />
    <span class="slider"></span>
  </label>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
